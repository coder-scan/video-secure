# ==============================================================================
# SECURE VIDEO PLATFORM - RENDER BLUEPRINT CONFIGURATION
# Reference: https://render.com/docs/blueprint-spec
# ==============================================================================

databases:
  # Managed PostgreSQL Database
  - name: secure-video-db
    databaseName: secure_video_db
    user: secure_video_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 1. Control Plane Web Service (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: secure-video-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secure-video-db
          property: connectionString
      - key: STORAGE_PROVIDER_TYPE
        value: LOCAL
      - key: LOCAL_STORAGE_BASE_PATH
        value: ./storage
      - key: CORS_ORIGINS
        value: "http://localhost:3000"

  # ----------------------------------------------------------------------------
  # 2. Next.js Creator Studio & Player Frontend
  # ----------------------------------------------------------------------------
  - type: web
    name: secure-video-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: secure-video-backend
          property: host
